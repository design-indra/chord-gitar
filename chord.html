<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Lagu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2 id="title"></h2>

<div class="controls">
  <button onclick="transpose(-1)">-</button>
  <span>Transpose</span>
  <button onclick="transpose(1)">+</button>
</div>

<div class="controls">
  <button onclick="startScroll()">▶ Scroll</button>
  <button onclick="stopScroll()">⏸ Stop</button>
</div>

<pre id="chord"></pre>

<script src="js/data.js"></script>
<script src="js/chord.js"></script>
</body>
</html>
