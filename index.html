<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IslamicDigitalApp - Premium Emerald Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #46A29F; 
            --primary-dark: #1B4D3E; 
            --secondary: #D4AF37;     
            --accent-light: #F9E076; 
            --bg: #F4F7F6; 
            --card: #FFFFFF;          
            --text: #1B4D3E; 
            --latin: #bc9512; 
            --radius: 24px;
            --gradient-emerald: linear-gradient(135deg, #46A29F, #1B4D3E);
            --gradient-gold: linear-gradient(135deg, #D4AF37, #F9E076);
            --shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .dark-theme { 
            --bg: #0A1613; --card: #152A25; --primary: #58C4C0; 
            --primary-dark: #81E6A4; --secondary: #F9E076; 
            --text: #E0F2EF; --latin: #F9E076; 
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg); color: var(--text); 
            transition: 0.3s; padding-bottom: 100px; 
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0A1613; 
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s;
        }
        .splash-content { text-align: center; color: var(--secondary); }
        .quran-logo-svg { 
            width: 130px; height: 130px; fill: var(--secondary); 
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
            margin-bottom: 20px; animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .loader-bar {
            width: 140px; height: 3px; background: rgba(255,255,255,0.1);
            margin: 15px auto; border-radius: 10px; overflow: hidden;
        }
        .loader-progress {
            width: 0%; height: 100%; background: var(--secondary);
            animation: loadProgress 1.5s forwards ease-in-out;
        }
        @keyframes loadProgress { to { width: 100%; } }
        .splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        header { 
            background: var(--gradient-emerald); color: white; padding: 25px 15px; 
            display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; 
            border-bottom-left-radius: var(--radius); border-bottom-right-radius: var(--radius); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-bottom: 3px solid var(--secondary); 
        }
        .header-title { flex-grow: 1; text-align: center; margin-right: 35px; }
        .theme-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }

        #top-info-section { background: var(--card); margin: 15px; padding: 20px; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow); }
        .calendar-box { font-size: 14px; font-weight: bold; color: var(--primary); }
        
        .container { padding: 0 15px; }
        .recent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 15px; margin-bottom: 25px; }
        .recent-item { 
            background: var(--gradient-emerald); color: white; padding: 12px 5px; 
            border-radius: 20px; height: 100px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; box-shadow: 0 5px 12px rgba(27,77,62,0.2); 
            cursor: pointer; border: 1px solid var(--secondary); 
        }
        .recent-item b { font-size: 10px; text-align: center; margin-top: 5px; width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border-left: 6px solid var(--secondary); box-shadow: 0 4px 10px rgba(0,0,0,0.03); cursor: pointer; }
        .ayat-box { background: var(--card); padding: 20px; margin-bottom: 15px; border-radius: var(--radius); border-bottom: 4px solid var(--secondary); }
        .teks-arab { font-family: 'Amiri', serif; font-size: 32px; direction: rtl; line-height: 2.3; text-align: right; color: var(--primary-dark); }
        .teks-latin { color: var(--latin); font-style: italic; font-size: 14px; margin: 15px 0 10px 0; }
        .teks-indo { font-size: 13px; opacity: 0.8; line-height: 1.6; border-top: 1px dashed #eee; padding-top: 10px; }

        /* --- ADZAN STYLES --- */
        .btn-adzan-toggle { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        .btn-adzan-off { background: #eee; color: #888; }
        .btn-adzan-on { background: var(--gradient-gold); color: var(--primary-dark); box-shadow: 0 4px 12px rgba(212,175,55,0.3); }

        .page-header { background: var(--gradient-emerald); padding: 40px 20px; border-radius: var(--radius); color: white; text-align: center; margin-bottom: 25px; border: 2px solid var(--secondary); position: relative; overflow: hidden; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: var(--card); display: flex; justify-content: space-around; align-items: center; border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); border-top: 2px solid var(--secondary); box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1000; }
        .nav-item { text-align: center; color: #888; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item span { font-size: 24px; display: block; }
        .play-btn { background: var(--gradient-gold); color: #1B4D3E; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="splash-content">
        <svg class="quran-logo-svg" viewBox="0 0 24 24"><path d="M19,2L14,6.5V17.5L19,13V2M6.5,5C4.57,5 2.89,5.83 1.74,7.14C1.27,7.67 1,8.34 1,9.05V20.5C1,21.42 1.9,22.08 2.77,21.82C4.04,21.44 5.31,21.25 6.5,21.25C8.31,21.25 10.38,21.75 12,22.5C13.62,21.75 15.69,21.25 17.5,21.25C18.69,21.25 19.96,21.44 21.23,21.82C22.1,22.08 23,21.42 23,20.5V9.05C23,8.34 22.73,7.67 22.26,7.14C21.11,5.83 19.43,5 17.5,5C15.63,5 13.88,5.75 12.5,7V7C11.12,5.75 9.37,5 7.5,5H6.5M7.5,7C8.94,7 10.27,7.66 11.21,8.7L12.5,10.11L13.79,8.7C14.73,7.66 16.06,7 17.5,7C18.91,7 20.15,7.59 21,8.5V19C19.91,18.66 18.77,18.5 17.5,18.5C15.5,18.5 13.5,19 12,20V11C12,9.34 10.66,8 9,8H7.5C6.23,8 5.09,8.16 4,8.5V19C5.23,18.66 6.37,18.5 7.5,18.5C9.5,18.5 11.5,19 13,20V20"/></svg>
        <h2 style="letter-spacing: 4px; margin: 0; font-family: 'Amiri', serif;">AL-QUR'AN</h2>
        <div class="loader-bar"><div class="loader-progress"></div></div>
    </div>
</div>

<header>
    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
    <div class="header-title"><h3 style="margin:0;">Al-Qur'an Mobile</h3></div>
</header>

<div id="top-info-section">
    <div class="calendar-box" id="calendar-display">Memuat Kalender...</div>
    <div id="renungan-box">"Hati yang bersyukur adalah magnet kebahagiaan."</div>
</div>

<div id="app-content"></div>

<audio id="adzan-player" src="https://www.islamcan.com/audio/adzan/azan1.mp3" preload="auto"></audio>

<nav class="bottom-nav">
    <div class="nav-item active" id="nav-0" onclick="showHome()"><span>🏠</span>Home</div>
    <div class="nav-item" id="nav-1" onclick="showCariAyat()"><span>🔍</span>Cari</div>
    <div class="nav-item" id="nav-2" onclick="loadJadwalPuasa()"><span>🕌</span>Rhamadan</div>
    <div class="nav-item" id="nav-3" onclick="showMenuLainnya()"><span>☰</span>Lainnya</div>
</nav>

<script>
    let currentAudio = new Audio();
    let selectedQori = '01';
    let prayerTimings = {};
    let isAdzanEnabled = false;

    window.addEventListener('load', () => {
        updateMasehi();
        showHome();
        initAdzanChecker();
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('splash-hidden');
        }, 1500); 
    });

    function updateMasehi() {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('calendar-display').innerText = new Date().toLocaleDateString('id-ID', options);
    }

    // --- LOGIKA ADZAN OTOMATIS ---
    function initAdzanChecker() {
        setInterval(() => {
            if (!isAdzanEnabled || !prayerTimings.Fajr) return;
            
            const now = new Date();
            const current = now.getHours().toString().padStart(2, '0') + ":" + 
                          now.getMinutes().toString().padStart(2, '0');
            
            const checkTimes = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
            if (checkTimes.some(t => prayerTimings[t] === current) && now.getSeconds() === 0) {
                const player = document.getElementById('adzan-player');
                player.play().catch(e => console.log("Autoplay blocked"));
                alert("Waktunya Shalat!");
            }
        }, 1000);
    }

    function toggleAdzan() {
        const player = document.getElementById('adzan-player');
        const btn = document.getElementById('btn-adzan-toggle');
        
        if (!isAdzanEnabled) {
            player.play().then(() => {
                player.pause();
                player.currentTime = 0;
                isAdzanEnabled = true;
                btn.className = "btn-adzan-toggle btn-adzan-on";
                btn.innerText = "✅ Adzan Otomatis Aktif";
            });
        } else {
            isAdzanEnabled = false;
            btn.className = "btn-adzan-toggle btn-adzan-off";
            btn.innerText = "🔈 Aktifkan Suara Adzan";
        }
    }

    // --- TAB RHAMADAN & JADWAL ---
    async function loadJadwalPuasa() {
        updateActiveNav(2);
        const area = document.getElementById('app-content');
        area.innerHTML = `<div style="text-align:center; padding:50px;">Mendeteksi lokasi...</div>`;

        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                const res = await fetch(`https://api.aladhan.com/v1/timingsByAddress?address=${pos.coords.latitude},${pos.coords.longitude}&method=11`);
                const json = await res.json();
                prayerTimings = json.data.timings;

                area.innerHTML = `
                    <div class="container">
                        <div class="card" style="background:var(--gradient-emerald); color:white; text-align:center; border-left:none; padding:25px;">
                            <h2 style="margin:0; font-family:'Amiri';">Jadwal Hari Ini</h2>
                            <p style="opacity:0.8; font-size:14px;">${json.data.date.readable}</p>
                            <button id="btn-adzan-toggle" onclick="toggleAdzan()" class="btn-adzan-toggle ${isAdzanEnabled ? 'btn-adzan-on' : 'btn-adzan-off'}">
                                ${isAdzanEnabled ? '✅ Adzan Otomatis Aktif' : '🔈 Aktifkan Suara Adzan'}
                            </button>
                        </div>

                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
                            <div class="card" style="display:block; text-align:center; padding:15px;">
                                <small style="color:var(--secondary);">SUBUH</small>
                                <h2 style="margin:5px 0;">${prayerTimings.Fajr}</h2>
                            </div>
                            <div class="card" style="display:block; text-align:center; padding:15px;">
                                <small style="color:var(--secondary);">DZUHUR</small>
                                <h2 style="margin:5px 0;">${prayerTimings.Dhuhr}</h2>
                            </div>
                            <div class="card" style="display:block; text-align:center; padding:15px;">
                                <small style="color:var(--secondary);">ASHAR</small>
                                <h2 style="margin:5px 0;">${prayerTimings.Asr}</h2>
                            </div>
                            <div class="card" style="display:block; text-align:center; padding:15px;">
                                <small style="color:var(--secondary);">MAGHRIB</small>
                                <h2 style="margin:5px 0;">${prayerTimings.Maghrib}</h2>
                            </div>
                        </div>

                        <div class="card" style="display:block; text-align:center; margin-top:10px; border-bottom:4px solid var(--secondary);">
                            <small style="color:var(--secondary); font-weight:bold;">IMSAK</small>
                            <h1 style="margin:5px 0; font-size:32px;">${prayerTimings.Imsak}</h1>
                        </div>
                    </div>`;
            } catch (e) { area.innerHTML = "Gagal memuat data."; }
        }, () => { area.innerHTML = "Akses lokasi ditolak."; });
    }

    // --- FUNGSI STANDAR LAINNYA (TIDAK BERUBAH) ---
    async function showHome() {
        updateActiveNav(0);
        document.getElementById('app-content').innerHTML = `
            <div class="container">
                <p style="font-size:10px; font-weight:bold; opacity:0.6; margin:15px 0 10px;">TERAKHIR DIBACA</p>
                <div class="recent-grid">${getHistoryHTML()}</div>
                <div id="list-container">Memuat Surah...</div>
            </div>`;
        const res = await fetch('https://equran.id/api/v2/surat');
        const data = await res.json();
        document.getElementById('list-container').innerHTML = data.data.map(s => `
            <div class="card" onclick="showDetail(${s.nomor}, '${s.namaLatin}')">
                <div><b>${s.nomor}. ${s.namaLatin}</b><br><small>${s.arti}</small></div>
                <div style="font-family:'Amiri'; color:var(--primary); font-size:22px;">${s.nama}</div>
            </div>`).join('');
    }

    async function showDetail(id, name) {
        saveHistory(id, name);
        const content = document.getElementById('app-content');
        content.innerHTML = '<p style="text-align:center; padding:50px;">Bismillah...</p>';
        const res = await fetch(`https://equran.id/api/v2/surat/${id}`);
        const json = await res.json();
        const s = json.data;
        let html = `<div class="container"><button onclick="showHome()" style="border:none; background:none; color:var(--primary); padding:15px 0; font-weight:bold;">← Kembali</button> <h2 style="text-align:center; font-family:'Amiri';">${s.namaLatin}</h2>`;
        s.ayat.forEach(a => {
            html += `<div class="ayat-box">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span style="background:var(--secondary); padding:2px 10px; border-radius:10px; font-size:10px;">Ayat ${a.nomorAyat}</span>
                    <button class="play-btn" onclick="playMurottal('${a.audio[selectedQori]}')">▶</button>
                </div>
                <div class="teks-arab">${a.teksArab}</div>
                <div class="teks-indo">${a.teksIndonesia}</div>
            </div>`;
        });
        content.innerHTML = html + "</div>";
    }

    function playMurottal(url) { currentAudio.pause(); currentAudio = new Audio(url); currentAudio.play(); }
    function saveHistory(num, name) {
        let h = JSON.parse(localStorage.getItem('readingHistory') || "[]");
        h = h.filter(x => x.num !== num); h.unshift({num, name});
        if(h.length > 3) h.pop(); localStorage.setItem('readingHistory', JSON.stringify(h));
    }
    function getHistoryHTML() {
        let h = JSON.parse(localStorage.getItem('readingHistory') || "[]");
        let html = '';
        for(let i=0; i<3; i++) {
            if(h[i]) html += `<div class="recent-item" onclick="showDetail(${h[i].num}, '${h[i].name}')"><b>${h[i].name}</b></div>`;
            else html += `<div class="recent-item" style="background:none; border:1px dashed #ccc;">-</div>`;
        }
        return html;
    }
    function updateActiveNav(n) { document.querySelectorAll('.nav-item').forEach((it, i) => it.classList.toggle('active', i===n)); }
    function toggleTheme() { document.body.classList.toggle('dark-theme'); }
    
    // Fungsi Dummy untuk Menu Lainnya & Cari
    function showMenuLainnya() { 
        updateActiveNav(3);
        document.getElementById('app-content').innerHTML = `<div class="container"><div class="card">Fitur Lainnya akan segera hadir.</div></div>`; 
    }
    function showCariAyat() { 
        updateActiveNav(1);
        document.getElementById('app-content').innerHTML = `<div class="container"><div class="card">Fitur Pencarian dalam pengembangan.</div></div>`; 
    }
</script>
</body>
</html>
